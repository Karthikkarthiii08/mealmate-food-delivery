{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); min-height: 100vh; }
        .navbar { background: var(--navbar-bg); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 10px var(--shadow); }
        .navbar .logo { font-size: 1.4rem; font-weight: 800; color: var(--orange); }
        .navbar .cart-btn { padding: 10px 22px; background: var(--orange); color: #fff; border-radius: 8px; font-weight: 600; font-size: 0.88rem; text-decoration: none; transition: background 0.2s; }
        .navbar .cart-btn:hover { background: var(--orange-dark); }
        .navbar .logout-btn { padding: 9px 20px; background: var(--red-bg); color: var(--red); border-radius: 8px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: background 0.2s; }
        .navbar .logout-btn:hover { background: #e53935; color: #fff; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
        .card { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px var(--shadow); transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 14px; }
        .card-body h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .card-body .desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border-light); }
        .price { font-weight: 700; color: var(--orange); font-size: 1rem; }
        .veg-badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        .veg { background: var(--green-bg); color: var(--green); }
        .non-veg { background: var(--red-bg); color: var(--red); }
        .btn-add { display: block; text-align: center; padding: 9px; background: var(--text-primary); color: var(--bg-solid); border-radius: 8px; font-weight: 600; font-size: 0.82rem; text-decoration: none; margin: 10px 14px 14px; transition: background 0.2s; }
        .btn-add:hover { background: var(--orange); color: #fff; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2e7d32; color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 9998; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🍔 MealMate</div>
        <a href="{% url 'show_cart' username %}" class="cart-btn">🛒 Go to Cart</a>
        <a href="{% url 'logout' %}" class="logout-btn">🚪 Logout</a>
    </nav>
    <div class="container">
        <p class="section-title">🍴 Menu for {{ username }}</p>
        <div class="grid">
            {% for item in itemList %}
            <div class="card">
                <img src="{{ item.picture }}" alt="{{ item.name }}">
                <div class="card-body">
                    <h3>{{ item.name }}</h3>
                    <p class="desc">{{ item.description }}</p>
                </div>
                <div class="card-footer">
                    <span class="price">₹{{ item.price }}</span>
                    <span class="veg-badge {% if item.vegeterian %}veg{% else %}non-veg{% endif %}">
                        {% if item.vegeterian %}🟢 Veg{% else %}🔴 Non-Veg{% endif %}
                    </span>
                </div>
                <a href="{% url 'add_to_cart' item.id username %}" class="btn-add" onclick="showToast('{{ item.name }} added to cart!')">+ Add to Cart</a>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = '✅ ' + msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
