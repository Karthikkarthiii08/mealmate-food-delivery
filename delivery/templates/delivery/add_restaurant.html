{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: var(--surface); border-radius: 16px; padding: 40px; width: 480px; max-width: 100%; box-shadow: 0 10px 40px var(--shadow-lg); }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .card-header .icon { width: 46px; height: 46px; background: var(--surface2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .card-header h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: 'Poppins', sans-serif; outline: none; transition: border 0.2s; margin-bottom: 18px; background: var(--input-bg); color: var(--text-primary); }
        input:focus { border-color: var(--orange); }
        .btn-submit { width: 100%; padding: 13px; background: var(--orange); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: var(--orange-dark); }
        .back { display: block; text-align: center; margin-top: 14px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; }
        .back:hover { color: var(--orange); }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon">🍽️</div>
            <h1>Add New Restaurant</h1>
        </div>
        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}
            <label>Restaurant Name</label>
            <input type="text" name="name" placeholder="e.g. Pizza Palace">
            <label>Picture URL</label>
            <input type="text" name="picture" placeholder="https://...">
            <label>Cuisine</label>
            <input type="text" name="cuisine" placeholder="e.g. Italian, Indian">
            <label>Rating (0–5)</label>
            <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="4.5">
            <button type="submit" class="btn-submit">Add Restaurant</button>
        </form>
        <a href="javascript:history.back()" class="back">← Back</a>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
