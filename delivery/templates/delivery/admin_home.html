{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600') center/cover no-repeat; display: flex; align-items: center; justify-content: center; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); }
        .content { position: relative; z-index: 1; text-align: center; color: #fff; padding: 40px 20px; }
        h1 { font-size: 2.8rem; font-weight: 800; color: var(--orange); text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 40px; }
        .btn-group { display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .btn { display: block; width: 280px; padding: 16px 30px; background: rgba(255,255,255,0.92); color: #1a1a2e; border-radius: 10px; font-size: 1rem; font-weight: 600; text-decoration: none; transition: background 0.2s, transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:hover { background: var(--orange); color: #fff; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn-logout { background: rgba(255,80,80,0.85); color: #fff; }
        .btn-logout:hover { background: #e53935; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>Welcome to Admin!!</h1>
        <div class="btn-group">
            <a href="open_add_restaurant" class="btn">➕ Add New Restaurants</a>
            <a href="open_show_restaurant" class="btn">🍽️ Show Restaurants</a>
            <a href="{% url 'logout' %}" class="btn btn-logout">🚪 Logout</a>
        </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
