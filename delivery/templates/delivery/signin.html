{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .card { display: flex; width: 820px; max-width: 95vw; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px var(--shadow-lg); background: var(--surface); }
        .card-image { flex: 1; background: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800') center/cover no-repeat; position: relative; min-height: 420px; }
        .card-image-overlay { position: absolute; inset: 0; background: var(--card-img-overlay); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; }
        .card-image-overlay h2 { color: #fff; font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .card-image-overlay p { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-top: 6px; }
        .card-form { flex: 1; padding: 50px 40px; display: flex; flex-direction: column; justify-content: center; }
        .card-form h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .card-form .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: 'Poppins', sans-serif; outline: none; transition: border 0.2s; margin-bottom: 20px; background: var(--input-bg); color: var(--text-primary); }
        input:focus { border-color: var(--orange); }
        .btn-submit { width: 100%; padding: 14px; background: var(--orange); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: background 0.2s, transform 0.2s; }
        .btn-submit:hover { background: var(--orange-dark); transform: translateY(-1px); }
        .signup-link { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted); }
        .signup-link a { color: var(--orange); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-image">
            <div class="card-image-overlay">
                <h2>MealMate</h2>
                <p>Your cravings, delivered.</p>
            </div>
        </div>
        <div class="card-form">
            <h1>SIGN IN</h1>
            <p class="subtitle">Welcome back! Let's get your food.</p>
            <form action="{% url 'signin' %}" method="post">
                {% csrf_token %}
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
                <button type="submit" class="btn-submit">SIGN IN</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="open_signup">Sign Up</a></p>
        </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
