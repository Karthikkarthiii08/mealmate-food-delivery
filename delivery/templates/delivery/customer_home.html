{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: var(--bg); }
        .navbar { background: var(--navbar-bg); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 10px var(--shadow); }
        .navbar .logo { font-size: 1.4rem; font-weight: 800; color: var(--orange); }
        .navbar .welcome { font-size: 0.9rem; color: var(--text-secondary); }
        .navbar .welcome span { font-weight: 700; color: var(--text-primary); }
        .navbar .logout-btn { padding: 9px 20px; background: var(--red-bg); color: var(--red); border-radius: 8px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: background 0.2s; }
        .navbar .logout-btn:hover { background: #e53935; color: #fff; }
        .hero { background: linear-gradient(135deg, #f5a623 0%, #ff5252 100%); padding: 50px 40px; text-align: center; color: #fff; }
        .hero h2 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .hero p { opacity: 0.9; font-size: 1rem; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .card { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px var(--shadow); transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px var(--shadow-md); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 16px; }
        .card-body h3 { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .card-body .cuisine { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px; }
        .card-body .rating { font-size: 0.85rem; color: var(--orange); font-weight: 600; margin-bottom: 14px; }
        .btn-menu { display: block; text-align: center; padding: 10px; background: var(--orange); color: #fff; border-radius: 8px; font-weight: 600; font-size: 0.88rem; text-decoration: none; transition: background 0.2s; }
        .btn-menu:hover { background: var(--orange-dark); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🍔 MealMate</div>
        <div class="welcome">Welcome, <span>{{ username }}</span></div>
        <a href="{% url 'logout' %}" class="logout-btn">🚪 Logout</a>
    </nav>
    <div class="hero">
        <h2>What are you craving today?</h2>
        <p>Browse restaurants and order your favourite food</p>
    </div>
    <div class="container">
        <p class="section-title">🍽️ Available Restaurants</p>
        <div class="grid">
            {% for r in restaurantList %}
            <div class="card">
                <img src="{{ r.picture }}" alt="{{ r.name }}">
                <div class="card-body">
                    <h3>{{ r.name }}</h3>
                    <p class="cuisine">{{ r.cuisine }}</p>
                    <p class="rating">⭐ {{ r.rating }} / 5</p>
                    <a href="{% url 'view_menu' r.id username %}" class="btn-menu">View Menu</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
