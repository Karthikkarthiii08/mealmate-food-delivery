{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
        .card { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        thead tr { background: var(--orange); }
        thead th { padding: 14px 18px; color: #fff; font-weight: 600; font-size: 0.88rem; text-align: left; }
        tbody tr { border-bottom: 1px solid var(--border-light); }
        tbody td { padding: 13px 18px; font-size: 0.88rem; color: var(--text-primary); }
        .total-row { background: var(--surface); border-radius: 14px; padding: 18px 24px; box-shadow: 0 4px 20px var(--shadow); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .total-row .label { font-size: 1rem; font-weight: 600; color: var(--text-secondary); }
        .total-row .amount { font-size: 1.4rem; font-weight: 800; color: var(--orange); }
        .btn-pay { display: block; width: 100%; padding: 15px; background: var(--orange); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: background 0.2s, transform 0.2s; }
        .btn-pay:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .error { background: var(--red-bg); color: var(--red); padding: 14px 18px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: var(--orange); }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-link">← Back to Cart</a>
        <div class="header">
            <h1>🧾 Checkout</h1>
            <p>Welcome, {{ username }}</p>
        </div>
        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% else %}
        <div class="card">
            <table>
                <thead><tr><th>Item</th><th>Price</th></tr></thead>
                <tbody>
                    {% for item in cart_items %}
                    <tr><td>{{ item.name }}</td><td>₹{{ item.price }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="total-row">
            <span class="label">Total</span>
            <span class="amount">₹{{ total_price }}</span>
        </div>
        <button id="rzp-button" class="btn-pay">💳 Pay with Razorpay</button>
        {% endif %}
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');

        var options = {
            "key": "{{ razorpay_key_id }}",
            "amount": {{ amount }} * 100,
            "currency": "INR",
            "name": "MealMate",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",
            "handler": function (response) {
                alert("Payment Successful!");
                window.location.href = "{% url 'orders' username %}";
            },
            "prefill": { "name": "{{ username }}", "email": "customer@example.com", "contact": "9999999999" },
            "theme": { "color": "#f5a623" }
        };
        var rzp = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e) { rzp.open(); e.preventDefault(); }
    </script>
</body>
</html>
