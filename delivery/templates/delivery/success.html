{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success – MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'delivery/theme.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .card { background: var(--surface); border-radius: 20px; padding: 50px 40px; text-align: center; box-shadow: 0 10px 40px var(--shadow-lg); }
        .icon { font-size: 3.5rem; margin-bottom: 14px; }
        h2 { font-size: 1.5rem; font-weight: 700; color: var(--green); }
        p { color: var(--text-muted); margin-top: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>Login Successful!</h2>
        <p>Welcome back to MealMate.</p>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mb-theme', t); applyTheme(t); }
        applyTheme(localStorage.getItem('mb-theme') || 'light');
    </script>
</body>
</html>
